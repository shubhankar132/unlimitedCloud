server:
  port: 8080

spring:
  application:
    name: cloudvault
  datasource:
    url: jdbc:h2:mem:cloudvault
    "driver-class-name": org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - email
              - profile
              - https://www.googleapis.com/auth/drive.readonly
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth?prompt=select_account&access_type=offline
