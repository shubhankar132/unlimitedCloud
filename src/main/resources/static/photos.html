<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>UnlimitedCloud</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f0f0f0;
            padding: 20px;
        }

        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 12px;
        }

        .card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .card p {
            font-size: 12px;
            padding: 6px;
            margin: 0;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>

    <h2>My Photos</h2>
    <div id="grid"></div>

    <script>
        fetch('/api/photos')
            .then(response => response.json())
            .then(data => {

                data.sort((a, b) => b.createdTime.localeCompare(a.createdTime));

                for (const photo of data) {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const link = document.createElement('a');
                    link.href = photo.webViewLink;
                    link.target = '_blank';

                    const img = document.createElement('img');
                    img.src = photo.thumbnailLink.replace('=s220', '=s400');
                    img.alt = photo.name;

                    const caption = document.createElement('p');
                    caption.textContent = photo.name;

                    link.appendChild(img);
                    card.appendChild(link);
                    card.appendChild(caption);
                    document.getElementById('grid').appendChild(card);
                }
            })
            .catch(error => {
                console.error('Error fetching photos:', error);
                document.getElementById('grid').textContent = 'Failed to load photos.';
            });
    </script>

</body>

</html>
